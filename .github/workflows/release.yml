name: Build Draft Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag
        required: true
        default: v0.4.0
      release_name:
        description: Release name
        required: true
        default: Proofline 0.4.0
permissions:
  contents: write
concurrency:
  group: draft-release-${{ inputs.release_tag }}
  cancel-in-progress: false
env:
  NODE_VERSION: 22
jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win, arch: x64, targets: 'msi nsis portable'}
          - {os: windows-latest, platform: win, arch: arm64, targets: 'msi nsis portable'}
          - {os: macos-latest, platform: mac, arch: x64, targets: 'dmg zip'}
          - {os: macos-latest, platform: mac, arch: arm64, targets: 'dmg zip'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build
      - name: Build and collect each target independently
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGETS: ${{ matrix.targets }}
        run: |
          mkdir -p upload
          printf 'target,exit_code,artifact_count\n' > upload/build-status.csv
          for target in $TARGETS; do
            rm -rf release
            status=0
            npx electron-builder --$PLATFORM "$target" --$ARCH --publish never || status=$?
            count=0
            if [ "$status" -eq 0 ]; then
              while IFS= read -r file; do
                cp "$file" upload/
                count=$((count + 1))
              done < <(find release -maxdepth 1 -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -size +1M 2>/dev/null)
            fi
            printf '%s,%s,%s\n' "$target" "$status" "$count" >> upload/build-status.csv
            if [ "$count" -eq 0 ]; then
              echo "$PLATFORM $ARCH $target failed or produced no valid artifact; exit=$status" > "upload/NO-ARTIFACT-$ARCH-$target.txt"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: upload
          if-no-files-found: error
          retention-days: 14
  draft-release:
    name: Create tagged draft Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
        with:
          script: |
            const fs = require('fs'), path = require('path');
            const {owner, repo} = context.repo;
            const tag = process.env.RELEASE_TAG, name = process.env.RELEASE_NAME;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Invalid tag');
            const groups = fs.readdirSync('release-assets');
            const expected = ['win-x64', 'win-arm64', 'mac-x64', 'mac-arm64'];
            if (groups.length !== expected.length || expected.some(g => !groups.includes(g))) throw new Error('Missing architecture artifacts');
            for (const group of groups) {
              const files = fs.readdirSync(path.join('release-assets', group));
              if (!files.some(f => /\.(exe|msi|dmg|zip)$/.test(f))) throw new Error(`No real artifacts for ${group}`);
            }
            let tagRef;
            try {
              tagRef = (await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag})).data;
            } catch (e) {
              if (e.status !== 404) throw e;
              tagRef = (await github.rest.git.createRef({owner, repo, ref: 'refs/tags/' + tag, sha: context.sha})).data;
            }
            const commit = (await github.rest.repos.getCommit({owner, repo, ref: tagRef.object.sha})).data;
            if (commit.sha !== context.sha) throw new Error('Tag does not point to workflow commit; refusing to move it');
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            if (releases.some(r => r.tag_name === tag)) throw new Error('Release already exists; refusing to overwrite it');
            const release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: context.sha, name, draft: true, prerelease: false, body: `## ${name}\n\nWindows x64/arm64 and macOS x64/arm64 cloud builds.\n\nWindows ia32 is not supported by Electron 44. No macOS universal build is included.\n\nSee build-status.csv and NO-ARTIFACT files for unsupported or failed formats. macOS builds are unsigned and not notarized.`})).data;
            for (const group of groups) {
              for (const file of fs.readdirSync(path.join('release-assets', group))) {
                const full = path.join('release-assets', group, file);
                await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name: `${group}-${file}`, data: fs.readFileSync(full)});
              }
            }
            core.notice(`Draft Release: ${release.html_url}`);
